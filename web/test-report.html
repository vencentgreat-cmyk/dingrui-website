<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="鼎瑞康隆水泥基自流平砂浆检测报告 WT2025B01C00106" />
  <title>检测报告 WT2025B01C00106 | 鼎瑞康隆</title>
  <style>
    :root{--navy:#0b3f6f;--blue:#114f82;--green:#169b69;--bg:#f4f7fa;--line:#d9e3ec;--text:#223446;--muted:#6e7f8f}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}
    .topbar{background:var(--navy);color:#fff;padding:18px 20px}
    .topbar-inner{max-width:1080px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px}
    .brand{display:flex;align-items:center;gap:12px}
    .logo{width:42px;height:42px;border:1px solid #3bd3a2;display:grid;place-items:center;font-weight:800;font-size:18px}
    .brand-cn{font-size:23px;font-weight:700;letter-spacing:2px}
    .brand-en{font-size:11px;letter-spacing:4px;color:#c8d9e8;margin-top:3px}
    .back{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.35);padding:9px 14px;font-size:14px}
    .wrap{max-width:1080px;margin:34px auto;padding:0 18px 50px}
    .card{background:#fff;border:1px solid var(--line);box-shadow:0 10px 28px rgba(22,48,74,.08)}
    .hero{padding:28px 30px 22px;border-bottom:1px solid var(--line)}
    .eyebrow{color:var(--green);font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
    h1{margin:7px 0 5px;color:var(--navy);font-size:30px}
    .en-title{color:var(--muted);font-size:14px}
    .meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:20px 30px;background:#f9fbfd;border-bottom:1px solid var(--line)}
    .meta-item{border-left:3px solid var(--green);padding:4px 0 4px 12px}
    .label{font-size:12px;color:var(--muted);margin-bottom:5px}
    .value{font-size:16px;font-weight:700;color:var(--text)}
    .report{padding:24px;text-align:center}
    .report img{display:block;width:100%;max-width:900px;height:auto;margin:0 auto;border:1px solid #e2e8ee;background:#fff}
    .foot{padding:16px 24px 22px;text-align:center;color:var(--muted);font-size:12px;line-height:1.8}
    @media(max-width:640px){.brand-en{letter-spacing:2px}.brand-cn{font-size:19px}.back{padding:8px 10px}.wrap{margin-top:18px;padding:0 10px 30px}.hero{padding:22px 18px 18px}h1{font-size:24px}.meta{grid-template-columns:1fr;padding:16px 18px}.report{padding:10px}.topbar{padding:12px 10px}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="logo">DR</div>
        <div>
          <div class="brand-cn">鼎瑞康隆</div>
          <div class="brand-en">DING RUI KANG LONG</div>
        </div>
      </div>
      <a class="back" href="index.html#page-contact">返回官网</a>
    </div>
  </header>

  <main class="wrap">
    <section class="card">
      <div class="hero">
        <div class="eyebrow">TEST REPORT</div>
        <h1>检测报告</h1>
        <div class="en-title">Test Report</div>
      </div>
      <div class="meta">
        <div class="meta-item">
          <div class="label">报告编号 / Report No.</div>
          <div class="value">WT2025B01C00106</div>
        </div>
        <div class="meta-item">
          <div class="label">产品名称 / Product</div>
          <div class="value">水泥基自流平砂浆</div>
        </div>
      </div>
      <div class="report">
        <img src="assets/reports/WT2025B01C00106-page1.jpg" alt="水泥基自流平砂浆检测报告 WT2025B01C00106" />
      </div>
      <div class="foot">
        陕西鼎瑞康隆新型环保科技有限公司<br />
        Shaanxi Dingrui Kanglong New Environmental Technology Co., Ltd.
      </div>
    </section>
  </main>
</body>
</html>
